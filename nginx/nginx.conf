server {
  listen 80;
    
  server_name brelkin.ru;

  location / {
    proxy_pass http://frontend:5173; 
  }  
  location /api {
    proxy_pass http://backend:1080;  
   }
}



server {
    listen              443 ssl;
    server_name         brelkin.com;
    ssl_certificate     "/etc/pki/nginx/brelkin.cer";
    ssl_certificate_key "/etc/pki/nginx/private/brelkin.key";
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    

location / {
    proxy_pass http://frontend:5173; 
  }  
  location /api {
    proxy_pass http://backend:1080;  
   }

}